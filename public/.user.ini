; PHP upload limits for the App Service default image, which ships
; upload_max_filesize=2M - smaller than the 10 MB the sheet converter accepts,
; so larger workbooks were rejected by PHP before Laravel ever saw them.
; PHP caches this file for user_ini.cache_ttl (300s); restart the app to apply
; it immediately.

upload_max_filesize = 12M
post_max_size = 16M

; Reading a multi-sheet xlsx with PhpSpreadsheet is memory- and time-hungry.
memory_limit = 512M
max_execution_time = 120
