# Manual deployment to Azure App Service. Nothing deploys on push.
#
# GitHub → Actions → "Deploy to Azure" → Run workflow:
#   - "Use workflow from": the branch (or tag) to deploy, e.g. master or a feature branch
#   - "Environment": staging or production
#
# Each target is a GitHub environment (Settings → Environments) holding:
#   - variable AZURE_WEBAPP_NAME           the App Service name (staging: scpma)
#   - secret   AZURE_WEBAPP_PUBLISH_PROFILE that app's publish profile (Azure portal → the app → Download publish profile)
#   - optional variable AZURE_WEBAPP_SLOT  deployment slot, default "Production" (Azure's name for the app's main slot)
# Protection rules on the environment (required reviewers, allowed branches) apply before the deploy job runs.
#
# Database migrations are not run here: after deploying, run `php artisan migrate --force` on the app (SSH / Kudu).

name: Deploy to Azure
run-name: Deploy ${{ github.ref_name }} to ${{ inputs.environment }} by @${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true

# One deployment per environment at a time; a second run waits instead of overlapping.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install PHP dependencies (no dev tools)
        run: |
          composer validate --no-check-publish
          composer install --prefer-dist --no-progress --no-dev --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Same major as development: package-lock.json is written by its npm (11), which npm 10 rejects.
          node-version: '24'
          cache: 'npm'

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      # The built assets are in public/build; node_modules is only needed to build them.
      - name: Remove build-only files
        run: rm -rf node_modules

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: php-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      # Refuse to deploy if the environment isn't set up, or its publish profile belongs to another app.
      - name: Check environment settings
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
          SLOT: ${{ vars.AZURE_WEBAPP_SLOT || 'Production' }}
          PROFILE: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          TARGET: ${{ inputs.environment }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$APP_NAME" ]; then
            echo "::error::Environment '$TARGET' has no AZURE_WEBAPP_NAME variable."; exit 1
          fi
          if [ -z "$PROFILE" ]; then
            echo "::error::Environment '$TARGET' has no AZURE_WEBAPP_PUBLISH_PROFILE secret."; exit 1
          fi
          site="$APP_NAME"
          if [ "$SLOT" != "Production" ]; then site="${APP_NAME}__${SLOT}"; fi
          if ! printf '%s' "$PROFILE" | grep -qi "msdeploySite=\"$site\""; then
            echo "::error::The publish profile in '$TARGET' is not for $site."; exit 1
          fi
          echo "Deploying $REF ($SHA) to $site"

      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: php-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          slot-name: ${{ vars.AZURE_WEBAPP_SLOT || 'Production' }}
          package: .
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
